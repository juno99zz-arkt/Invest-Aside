name: 투자 대시보드 업데이트 (Aside)

# 비용 0원 구조
#   토 09:00 KST  prepare  : 정량 신호·후보 선정·분석 요청서(data/pending/request.json) 생성
#   토 오전       Aside 루틴이 요청서를 읽고 AI 분석 → data/aside/result.json 업로드(push)
#   push 감지     finalize : 편입·유지·제외 결정 + 이력·리포트 갱신
#   매일 17:00 KST daily   : 시세·PEG·M7/M8 갱신
#   (모든 실행 마지막에 대시보드 생성 → gh-pages 배포)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = 시세 갱신 / prepare = 주간 신호·후보·분석요청서 생성 / finalize = Aside 결과 반영 / sec_check = SEC 접근 점검"
        type: choice
        options: [daily, prepare, finalize, sec_check]
        default: daily
  push:
    branches: [main]
    paths: ["data/aside/**"]
  schedule:
    - cron: "0 8 * * *"    # 매일 KST 17:00 시세 갱신
    - cron: "0 0 * * 6"    # 매주 토 KST 09:00 주간 prepare

permissions:
  contents: write

concurrency:
  group: invest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃 (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then m=finalize
          elif [ "${{ github.event.schedule }}" = "0 0 * * 6" ]; then m=prepare
          elif [ -n "${{ inputs.mode }}" ]; then m="${{ inputs.mode }}"
          else m=daily; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "실행 모드: $m"

      - name: SEC 접근 점검
        if: steps.mode.outputs.mode == 'sec_check'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sec_data.py

      - name: 주간 prepare (신호·후보·분석 요청서)
        if: steps.mode.outputs.mode == 'prepare'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run_weekly.py prepare

      - name: finalize (Aside 분석 결과 반영)
        if: steps.mode.outputs.mode == 'finalize'
        run: python run_weekly.py finalize

      - name: 데이터 커밋
        if: steps.mode.outputs.mode == 'prepare' || steps.mode.outputs.mode == 'finalize'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "주간 ${{ steps.mode.outputs.mode }}: $(TZ=Asia/Seoul date +%G-W%V)"
          git pull --rebase origin main
          git push

      - name: 투자 대시보드 생성
        run: python generate_invest.py

      - name: gh-pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
